# =====================================================================
# Carte météo Aussonne — configuration Home Assistant
# =====================================================================

# 1) Enregistrer la ressource JS (à mettre dans configuration.yaml si vous
#    gérez Lovelace en mode YAML — sinon voir README.md pour la méthode
#    par l'interface : Paramètres > Tableaux de bord > ⋮ > Ressources)
lovelace:
  resources:
    - url: /local/weather-card-aussonne.js
      type: module

# 2) Carte à ajouter dans votre vue (dashboard) — mode YAML.
#    À copier tel quel dans la liste "cards:" de votre vue.
- type: custom:weather-card-aussonne
  entity: weather.aussonne
  sun_entity: sun.sun
  forecast_days: 4
