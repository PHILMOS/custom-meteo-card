# =====================================================================
# Carte météo Aussonne — configuration Home Assistant
# =====================================================================

# 1) Ressource JS.
#    - Installée via HACS : la ressource est ajoutée automatiquement.
#      (sinon : Paramètres > Tableaux de bord > ⋮ > Ressources)
#      url: /hacsfiles/custom-meteo-card/custom-meteo-card.js
#    - Installée manuellement (fichier copié dans config/www/) :
lovelace:
  resources:
    - url: /local/custom-meteo-card.js
      type: module

# 2) Carte à ajouter dans votre vue (dashboard) — mode YAML.
#    À copier tel quel dans la liste "cards:" de votre vue.
- type: custom:weather-card-aussonne
  entity: weather.aussonne
  sun_entity: sun.sun
  forecast_days: 4
  forecast_hours: 5
